name: Publish to npm

on:
  release:
    types: [published]

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js and npm
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@11

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify package
        run: bun run check

      - name: Verify release tag
        run: |
          version="$(bun -e 'console.log((await import("./package.json", { with: { type: "json" } })).default.version)')"
          test "$GITHUB_REF_NAME" = "v$version"

      - name: Publish package
        run: npm publish --access public --provenance --ignore-scripts
        env:
          # Bootstrap fallback for the first publication. npm uses the GitHub
          # OIDC identity first once a Trusted Publisher has been configured.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
